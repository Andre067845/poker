# Blueprint de Render (plan GRATIS): Render -> New -> Blueprint -> este repositorio.
# Los datos se respaldan en una base Postgres gratuita (Neon), porque el plan gratis no tiene disco.
services:
  - type: web
    name: poker-entre-amigos
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      # Opcional: agregá DATABASE_URL (Postgres gratis de Neon) en Environment
      # para que cuentas e historial sobrevivan a los reinicios del plan gratis.
