# Blueprint de Render (plan GRATIS): Render -> New -> Blueprint -> este repositorio.
# Los datos se respaldan en una base Postgres gratuita (Neon), porque el plan gratis no tiene disco.
services:
  - type: web
    name: poker-entre-amigos
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false   # Render te la pide al crear: pegá la "connection string" de Neon
